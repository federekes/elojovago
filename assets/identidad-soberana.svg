<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Mi identidad soberana es mía">
  <rect width="1200" height="675" fill="#14213d"/>
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#fca311" stroke-width="6"/>
  <text x="600" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#fca311" letter-spacing="6">DESCARGO DEL AUTOR</text>
  <text x="600" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="86" font-weight="bold" fill="#ffffff">Mi identidad soberana</text>
  <text x="600" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="86" font-weight="bold" fill="#ffffff">es mía</text>
  <text x="600" y="540" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#e5e5e5">Sobre Gustavo Salle y mi primer intento en política</text>
